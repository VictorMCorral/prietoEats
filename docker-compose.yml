services:
  db:
    image: postgres:16-alpine
    container_name: prietoeats-db
    environment:
      - POSTGRES_DB=prieto_eats
      - POSTGRES_USER=victor
      - POSTGRES_PASSWORD=noteolvides01
    volumes:
      - prietoeats_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victor -d prieto_eats"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_internal
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prietoeats-app
    working_dir: /app
    env_file: .env
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=prieto_eats
      - DB_USERNAME=victor
      - DB_PASSWORD=noteolvides01
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    volumes:
      - ./:/app
    ports:
      - "1234:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_internal
    restart: unless-stopped

networks:
  app_internal:
    name: prietoeats_internal

volumes:
  prietoeats_pgdata:
